<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Sign in | MCP Uni Hubs</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
      :root {
        font-family: 'Manrope', 'Avenir Next', sans-serif;
        color: #17241f;
        --forest: #164b3c;
        --forest-dark: #102b25;
        --lime: #c7ef69;
        --muted: #718078;
        --line: #dce4dd;
        --mono: 'DM Mono', 'SFMono-Regular', monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 12% 18%, #d7ebc480 0%, transparent 42%),
          radial-gradient(circle at 88% 78%, #c9ddd280 0%, transparent 40%),
          linear-gradient(160deg, #edf1ec 0%, #e4ebe4 100%);
      }
      .login-panel {
        width: min(420px, 100%);
        padding: 34px 30px 30px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(251, 252, 249, 0.96);
        box-shadow: 0 18px 40px #14281c14;
      }
      .login-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .brand-mark {
        display: grid;
        width: 35px;
        aspect-ratio: 1;
        place-items: center;
        border-radius: 9px;
        color: var(--forest-dark);
        background: var(--lime);
        font-size: 19px;
        font-weight: 800;
      }
      .login-brand strong { display: block; font-size: 15px; }
      .login-brand small {
        display: block;
        margin-top: 3px;
        color: #7d8f85;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 1.1px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }
      .google-signin {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border-radius: 6px;
        color: #f5faf5;
        background: var(--forest);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      .google-signin:hover { background: var(--forest-dark); }
    </style>
  </head>
  <body>
    <main class="login-panel">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true">M</span>
        <div>
          <strong>MCP Uni Hubs</strong>
          <small>CONTROL PLANE</small>
        </div>
      </div>
      <h1>Sign in to continue</h1>
      <p>Use a Google account whose verified email matches a datastore user.</p>
      <a class="google-signin" href="/auth/google">Sign in with Google</a>
    </main>
  </body>
</html>
